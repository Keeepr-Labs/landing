<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#4524CC" />
    <meta
      name="description"
      content="Keeep makes it easier to stick to your workout goals. Commit to a number of workouts a month, put a pledge behind it, and share it with your friends. Not a fitness app — an accountability system."
    />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/favicon.png" />
    <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
    <title>Keeep — Stick to it.</title>

    <!-- Social preview. The /invite route serves its own OG tags via the
         Netlify edge function; these are the defaults for every other page. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Keeep" />
    <meta property="og:title" content="Keeep — Stick to it." />
    <meta
      property="og:description"
      content="Accountability + stakes. Commit to your workouts, pledge something real, and share it with friends. There’s nowhere to hide."
    />
    <meta property="og:url" content="https://getkeeep.com/" />
    <meta property="og:image" content="https://getkeeep.com/images/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Keeep — Stick to it." />
    <meta
      name="twitter:description"
      content="Accountability + stakes. Commit to your workouts, pledge something real, and share it with friends."
    />
    <meta name="twitter:image" content="https://getkeeep.com/images/og-image.png" />
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <!--
      This HTML file is a template.
      If you open it directly in the browser, you will see an empty page.

      You can add webfonts, meta tags, or analytics to this file.
      The build step will place the bundled scripts into the <body> tag.

      To begin the development, run `npm start` or `yarn start`.
      To create a production bundle, use `npm run build` or `yarn build`.
    -->
  </body>
</html>
